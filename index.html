<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ETNADE</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    min-height: 100%;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #FAF6EE;
    color: #1A1A1A;
  }

  /* ===== HEADER ===== */
  .header {
    background-color: #2D4A3E;
    padding: 20px 16px 18px;
    text-align: center;
    border-bottom: 4px solid #E8A24C;
  }

  .header img {
    width: 76px;
    height: 76px;
    display: block;
    margin: 0 auto 8px auto;
    border-radius: 50%;
    background-color: #FFFFFF;
    padding: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .header h1 {
    color: #FFFFFF;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .header p {
    color: #E8A24C;
    font-size: 14px;
    margin-top: 4px;
    font-weight: bold;
  }

  /* ===== MAIN ===== */
  .main {
    padding: 24px 16px 16px 16px;
    max-width: 500px;
    margin: 0 auto;
  }

  .question {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #2D4A3E;
    margin-bottom: 20px;
  }

  /* ===== BOTONES GRANDES ===== */
  .big-button {
    display: block;
    width: 100%;
    text-decoration: none;
    border-radius: 16px;
    padding: 26px 16px;
    margin-bottom: 18px;
    text-align: center;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .big-button .icon {
    font-size: 40px;
    display: block;
    margin-bottom: 8px;
    line-height: 1;
  }

  .big-button .label {
    font-size: 22px;
    font-weight: bold;
    line-height: 1.3;
    display: block;
  }

  .btn-consultar {
    background-color: #3F8C5E;
    color: #FFFFFF;
  }

  .btn-comprobante {
    background-color: #2D6CA6;
    color: #FFFFFF;
  }

  /* ===== SEPARADOR ===== */
  .divider {
    border-top: 2px solid #E5DECF;
    margin: 28px 0 20px 0;
  }

  /* ===== SECCION SECUNDARIA ===== */
  .secondary-title {
    text-align: center;
    font-size: 17px;
    color: #5C5850;
    margin-bottom: 14px;
  }

  .small-button {
    display: block;
    width: 100%;
    text-decoration: none;
    background-color: #FFFFFF;
    border: 2px solid #E8A24C;
    color: #2D4A3E;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 14px;
  }

  .phone-box {
    background-color: #FFFFFF;
    border: 2px solid #E5DECF;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }

  .phone-box .phone-label {
    font-size: 15px;
    color: #5C5850;
    margin-bottom: 4px;
  }

  .phone-box .phone-number {
    font-size: 24px;
    font-weight: bold;
    color: #2D4A3E;
  }

  /* ===== PANTALLA: CONSULTAR CUOTA ===== */
  .screen {
    display: none;
  }

  .screen.active {
    display: block;
  }

  .back-link {
    display: inline-block;
    font-size: 17px;
    color: #2D4A3E;
    font-weight: bold;
    text-decoration: none;
    margin-bottom: 18px;
    padding: 6px 0;
  }

  .form-title {
    font-size: 22px;
    font-weight: bold;
    color: #2D4A3E;
    margin-bottom: 8px;
    text-align: center;
  }

  .form-subtitle {
    font-size: 17px;
    color: #5C5850;
    margin-bottom: 20px;
    text-align: center;
  }

  .dni-input {
    width: 100%;
    font-size: 24px;
    padding: 18px;
    border: 2px solid #2D4A3E;
    border-radius: 12px;
    margin-bottom: 16px;
    text-align: center;
    background-color: #FFFFFF;
    color: #1A1A1A;
  }

  .dni-input:focus {
    outline: 3px solid #E8A24C;
  }

  .submit-button {
    width: 100%;
    font-size: 22px;
    font-weight: bold;
    padding: 20px;
    border: none;
    border-radius: 14px;
    background-color: #3F8C5E;
    color: #FFFFFF;
    cursor: pointer;
  }

  .result-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    display: none;
  }

  .result-box.show {
    display: block;
  }

  .result-ok {
    background-color: #E3F2E8;
    border: 2px solid #3F8C5E;
    color: #1F5C38;
  }

  .result-error {
    background-color: #FBEAEA;
    border: 2px solid #C0504D;
    color: #8C2F2C;
  }

  .loading-text {
    text-align: center;
    font-size: 18px;
    color: #5C5850;
    margin-top: 16px;
    display: none;
  }

  .loading-text.show {
    display: block;
  }
</style>
</head>

  <div class="screen" id="screen-consultar">
    <div class="main">

      <a class="back-link" href="#" onclick="mostrarPantalla('screen-inicio'); return false;">← Volver</a>

      <div class="form-title">Consultar cuota</div>
      <div class="form-subtitle">Ingresá el DNI del alumno</div>

      <input type="tel" inputmode="numeric" pattern="[0-9]*" class="dni-input" id="dni-input" placeholder="Ej: 38123456" maxlength="8">

      <button class="submit-button" onclick="consultarDNI()">Consultar</button>

      <div class="loading-text" id="loading-text">Consultando, esperá un momento...</div>

      <div class="result-box" id="result-box"></div>

    </div>

  <script>
    function mostrarPantalla(id) {
      var pantallas = document.querySelectorAll('.screen');
      for (var i = 0; i < pantallas.length; i++) {
        pantallas[i].classList.remove('active');
      }
      document.getElementById(id).classList.add('active');

      // Limpiar resultado anterior al volver a entrar
      if (id === 'screen-consultar') {
        document.getElementById('dni-input').value = '';
        document.getElementById('result-box').classList.remove('show', 'result-ok', 'result-error');
        document.getElementById('loading-text').classList.remove('show');
      }
    }

    function consultarDNI() {
      var dni = document.getElementById('dni-input').value.trim();
      var resultBox = document.getElementById('result-box');
      var loadingText = document.getElementById('loading-text');

      resultBox.classList.remove('show', 'result-ok', 'result-error');

      // Validación simple: 7 u 8 dígitos
      if (!/^[0-9]{7,8}$/.test(dni)) {
        resultBox.textContent = 'Ingresá un DNI válido (7 u 8 números).';
        resultBox.classList.add('show', 'result-error');
        return;
      }

      loadingText.classList.add('show');

      // ============================================
      // REEMPLAZAR ESTA URL con el webhook de n8n
      // que recibe el DNI y devuelve el monto.
      // Debe responder en formato JSON, por ejemplo:
      // { "monto": 72220 }   o   { "encontrado": false }
      // ============================================
      var URL_WEBHOOK_CONSULTA = "https://vps-6071392-x.dattaweb.com/webhook/consultar-cuota";

      fetch(URL_WEBHOOK_CONSULTA, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dni: dni })
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          loadingText.classList.remove('show');

          if (data && data.encontrado === false) {
            resultBox.textContent = 'No encontramos ese DNI. Comunicate con administración.';
            resultBox.classList.add('show', 'result-error');
          } else if (data && data.monto) {
            resultBox.textContent = 'Monto a pagar: $' + data.monto;
            resultBox.classList.add('show', 'result-ok');
          } else {
            resultBox.textContent = 'No pudimos consultar en este momento. Probá de nuevo.';
            resultBox.classList.add('show', 'result-error');
          }
        })
        .catch(function () {
          loadingText.classList.remove('show');
          resultBox.textContent = 'No pudimos conectar. Probá de nuevo en un momento.';
          resultBox.classList.add('show', 'result-error');
        });
    }
  </script>
